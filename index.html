<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scent Shots | Premium Men's Decants</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap');
    
    * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
    
    /* Dark Theme Backgrounds and Text */
    body { background-color: #0a0a0a; color: #f5f5f5; }
    
    /* Premium Header with Gold Accent */
    header { 
      background: #000; 
      color: #fff; 
      padding: 25px 20px; 
      text-align: center; 
      letter-spacing: 3px; 
      border-bottom: 2px solid #d4af37; /* Gold accent line */
    }
    header h1 { font-weight: 800; text-transform: uppercase; }
    header h1 span { color: #d4af37; } /* Highlights a part of the text in gold */
    
    /* Hero Section */
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h2 { font-size: 28px; text-transform: uppercase; margin-bottom: 10px; color: #d4af37; }
    .hero p { color: #aaa; font-size: 15px; }
    
    /* Search Bar Styling for Dark Theme */
    .search-container { 
      max-width: 600px; 
      margin: 0 auto 40px auto; 
      padding: 0 15px; 
    }
    #searchCategories { 
      width: 100%; 
      padding: 15px 20px; 
      font-size: 16px; 
      border: 1px solid #333; 
      border-radius: 8px; 
      outline: none; 
      background: #1a1a1a; 
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: border-color 0.3s;
    }
    #searchCategories::placeholder { color: #777; }
    #searchCategories:focus { border-color: #d4af37; }
    
    /* Four-Column Responsive Grid Layout */
    .widget-container { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 25px; 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 0 20px 60px; 
    }
    
    /* Dark Theme Widget Styling */
    .category-widget { 
      text-decoration: none; 
      color: inherit; 
      display: block; 
      background: #161616;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    /* Gold hover effect */
    .category-widget:hover { 
      transform: translateY(-8px); 
      border-color: #d4af37;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
    }
    
    .category-widget img { 
      width: 100%; 
      height: 350px; 
      object-fit: cover; 
      margin-bottom: 15px; 
      border-radius: 5px;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    .category-widget:hover img {
      opacity: 1; /* Brightens the image on hover */
    }
    
    .category-widget h3 { 
      text-align: center; 
      font-size: 20px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      font-weight: 600;
      color: #fff;
    }

    /* Tablet view: 2x2 grid */
    @media (max-width: 1024px) {
      .widget-container { grid-template-columns: 1fr 1fr; }
    }

    /* Mobile view: stack them into 1 column */
    @media (max-width: 768px) {
      .widget-container { grid-template-columns: 1fr; }
      .category-widget img { height: 280px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>SCENT <span>SHOTS</span></h1>
  </header>

  <section class="hero">
    <h2>Choose Your Collection</h2>
    <p>Premium Men's Fragrance Decants & Full Bottles</p>
  </section>

  <!-- NEW SEARCH BAR -->
  <div class="search-container">
    <input type="text" id="searchCategories" placeholder="Search collections (e.g., Summer, Designer)..." onkeyup="filterCollections()">
  </div>

<div class="widget-container" id="widget-grid">
    
    <!-- SUMMER WIDGET -->
    <a href="summer.html" class="category-widget">
      <img src="https://images.unsplash.com/photo-1523293115678-d2900e5ce8eb?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Summer Fragrances">
      <h3>☀️ Summer Collection</h3>
    </a>

    <!-- WINTER WIDGET -->
    <a href="winter.html" class="category-widget">
      <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Winter Fragrances">
      <h3>❄️ Winter Collection</h3>
    </a>

    <!-- FULL SIZE WIDGET -->
    <a href="full-size.html" class="category-widget">
      <!-- I kept your working image here just in case -->
      <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=600" alt="Full Size Bottles">
      <h3>🍾 Full-Size Bottles</h3>
    </a>

    <!-- DESIGNER WIDGET -->
    <a href="designer.html" class="category-widget">
      <img src="https://images.unsplash.com/photo-1616949755610-8c9bac08f9f8?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Designer Perfumes">
      <h3>✨ Designer Perfumes</h3>
    </a>

  </div>
  <!-- JAVASCRIPT FOR SEARCH FILTERING -->
  <script>
    function filterCollections() {
      // Get the search input
      let input = document.getElementById('searchCategories').value.toLowerCase();
      // Get all the category widgets
      let widgets = document.getElementsByClassName('category-widget');

      // Loop through all widgets
      for (let i = 0; i < widgets.length; i++) {
        // Find the text inside the <h3> tag of each widget
        let title = widgets[i].querySelector('h3').innerText.toLowerCase();
        
        // Show or hide based on the search
        if (title.includes(input)) {
          widgets[i].style.display = "block";
        } else {
          widgets[i].style.display = "none";
        }
      }
    }
  </script>

</body>
</html>
