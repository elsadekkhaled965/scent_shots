<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scent Shots | Home</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');

    * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }

    body { background-color: #fafafa; color: #111; }

    

    header { background: #111; color: #fff; padding: 20px; text-align: center; letter-spacing: 2px; }

    

    .hero { text-align: center; padding: 40px 20px; }

    .hero h2 { font-size: 28px; text-transform: uppercase; margin-bottom: 10px; }

    

    /* Four-Column Responsive Grid Layout */

    .widget-container { 

      display: grid; 

      grid-template-columns: repeat(4, 1fr); /* Four columns for desktop */

      gap: 20px; 

      max-width: 1200px; /* Increased to fit 4 widgets comfortably */

      margin: 0 auto; 

      padding: 0 20px 50px; 

    }

    

    /* Widget Styling */

    .category-widget { 

      text-decoration: none; 

      color: inherit; 

      display: block; 

      background: #fff;

      padding: 15px;

      transition: transform 0.3s;

      box-shadow: 0 4px 10px rgba(0,0,0,0.05);

    }

    .category-widget:hover { transform: translateY(-5px); }

    

    .category-widget img { 

      width: 100%; 

      height: 350px; 

      object-fit: cover; 

      margin-bottom: 15px; 

    }

    

    .category-widget h3 { 

      text-align: center; 

      font-size: 22px; 

      text-transform: uppercase; 

      letter-spacing: 1px; 

    }



    /* Tablet view: 2x2 grid */

    @media (max-width: 1024px) {

      .widget-container { grid-template-columns: 1fr 1fr; }

    }



    /* Mobile view: stack them into 1 column */

    @media (max-width: 768px) {

      .widget-container { grid-template-columns: 1fr; }

    }

  </style>

</head>

<body>



  <header>

    <h1>SCENT SHOTS</h1>

  </header>



  <section class="hero">

    <h2>Choose Your Collection</h2>

    <p>Select a category to view available decants and full bottles.</p>

  </section>

<script>
    // 1. Create an empty directory that the script will fill automatically
    let allProducts = [];

    // 2. Tell the script which pages to scan in the background
    const pagesToScan = [
      { url: 'summer.html', category: 'Summer' },
      { url: 'winter.html', category: 'Winter' },
      { url: 'designer.html', category: 'Designer' },
      { url: 'full-size.html', category: 'Full Size' }
    ];

    // 3. The scanner function
    async function buildSearchDirectory() {
      for (let page of pagesToScan) {
        try {
          // Silently fetch the HTML of the other pages
          let response = await fetch(page.url);
          let htmlString = await response.text();
          
          // Turn that text into a hidden webpage the code can read
          let parser = new DOMParser();
          let hiddenDoc = parser.parseFromString(htmlString, 'text/html');
          
          // Find every product card on that page
          let cards = hiddenDoc.querySelectorAll('.card');
          
          // Extract the name from the <h3> tag and add it to our directory
          cards.forEach(card => {
            let titleElement = card.querySelector('h3');
            if (titleElement) {
              allProducts.push({
                name: titleElement.innerText.trim(),
                category: page.category,
                url: page.url
              });
            }
          });
        } catch (error) {
          console.error("Could not load page for search: ", page.url);
        }
      }
    }

    // 4. Run the scanner immediately when the homepage loads!
    window.onload = buildSearchDirectory;

    // 5. The actual search function (Same as before, but uses the auto-generated list)
    function searchAllProducts() {
      const input = document.getElementById('globalSearch').value.toLowerCase();
      const resultsDiv = document.getElementById('searchResults');
      
      resultsDiv.innerHTML = ''; 

      if (input.length === 0) {
        resultsDiv.style.display = 'none';
        return;
      }

      // Filter our automatically built list
      const matches = allProducts.filter(product => product.name.toLowerCase().includes(input));

      if (matches.length > 0) {
        resultsDiv.style.display = 'block';
        matches.forEach(match => {
          resultsDiv.innerHTML += `
            <a href="${match.url}">
              ${match.name} 
              <span class="search-category-tag">${match.category}</span>
            </a>
          `;
        });
      } else {
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = '<div style="padding: 15px 20px; color: #777;">No perfumes found.</div>';
      }
    }
  </script>

  <div class="widget-container">

    

    <!-- SUMMER WIDGET -->

    <a href="summer.html" class="category-widget">

      <!-- Replace src with your summer aesthetic photo -->

      <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=600" alt="Summer Fragrances">

      <h3>☀️ Summer Collection</h3>

    </a>



    <!-- WINTER WIDGET -->

    <a href="winter.html" class="category-widget">

      <!-- Replace src with your winter aesthetic photo -->

      <img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de?q=80&w=600" alt="Winter Fragrances">

      <h3>❄️ Winter Collection</h3>

    </a>



    <!-- FULL SIZE WIDGET -->

    <a href="full-size.html" class="category-widget">

      <!-- Replace src with your full size aesthetic photo -->

      <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=600" alt="Full Size Bottles">

      <h3>🍾 Full-Size Bottles</h3>

    </a>



    <!-- DESIGNER WIDGET -->

    <a href="designer.html" class="category-widget">

      <!-- Replace src with your designer aesthetic photo -->

      <img src="https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?q=80&w=600" alt="Designer Perfumes">

      <h3>✨ Designer Perfumes</h3>

    </a>



  </div>

</body>

</html>
